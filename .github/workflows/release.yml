name: Release

# Publishes to npm when a GitHub release is published (e.g. `gh release create v1.2.3`).
# Authenticates with npm trusted publishing (OIDC): no npm token or 2FA code is stored here.
# The trusted publisher on npmjs.com must name this repository and the workflow file `release.yml`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build before uploading.
      # Pre-releases (e.g. v1.1.0-beta.1, or a release marked as pre-release) go to the `next` dist-tag.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
